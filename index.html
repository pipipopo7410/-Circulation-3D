<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<meta name="theme-color" content="#eef6fa"/>
<title>3D 血液循環｜模型中心線整合版 V0.57</title>
<link rel="stylesheet" href="./style.css"/>
<script src="./vendor-config.js"></script>
<script>
// Local libraries are preferred only after the verified vendor build is present.
window.__vendorMode = window.__vendorLocal ? 'local' : 'cdn';
window.__viewerDiagnostics={version:'V0.57',modelsLoaded:0,error:null};
const alt = new URLSearchParams(location.search).get('cdn') === 'unpkg';
window.__threeCdn = alt ? 'https://unpkg.com/three@0.160.1/' : 'https://cdn.jsdelivr.net/npm/three@0.160.1/';
const base = window.__vendorLocal ? './vendor/three/' : window.__threeCdn;
const im = document.createElement('script'); im.type='importmap';
im.textContent = JSON.stringify({imports:{'three':base+'build/three.module.js','three/addons/':base+'examples/jsm/'}});
document.head.appendChild(im);
</script>
</head>
<body>
<div id="app" class="app">
  <main class="scene" id="scene" aria-label="人體血管三維模型操作區">
    <div class="sceneTop"><div class="brand"><span class="brand-mark">◉</span><span>3D 血液循環<small>立體血管 · V0.57</small></span></div><div class="sceneActions"><button id="organBtn" class="organToggle" type="button" aria-label="切換器官顯示狀態">器官：半透明</button><button class="round" id="toolBtn" aria-label="進階工具" aria-expanded="false">⚙</button></div></div>
    <div id="view" class="view" aria-label="3D 模型：單指旋轉、雙指平移與縮放"></div>
    <button id="resetBtn" class="sceneReset" type="button" aria-label="回到全身視角"><span aria-hidden="true">◎</span><span>全身</span></button>
    <div class="loading" id="loading" role="status"><div class="loadingIcon">◌</div><strong id="loadingTitle">準備解剖模型…</strong><div id="loadingDetail">正在初始化 3D 顯示</div><div class="loadingBar"><div id="loadingFill"></div></div><button id="retry" hidden>改用備援連線重新載入</button><a href="./diagnostics.html" class="loadingHelp">檢查模型與瀏覽器環境</a></div>
    <div class="organLabels" id="organLabels" hidden aria-hidden="true"><span class="organLabel" data-organ="right">右肺</span><span class="organLabel organLabelHeart" data-organ="heart">心臟</span><span class="organLabel" data-organ="left">左肺</span></div>
    <div class="infoTag" id="infoTag" hidden></div>
    <div id="lessonCue" class="lessonCue" hidden aria-live="off"><strong id="lessonCueName"></strong><small id="lessonCueOxygen"></small></div>
    <div class="sceneFoot" id="sceneFoot"><span id="statusText">從完整血管開始探索</span><span id="modelCount">—</span></div>
    <div class="toast" id="toast" hidden></div>
  </main>
  <aside class="dock" id="dock">
    <div class="dockTitle">血管探索 <span class="dockHint">單指旋轉 · 雙指平移／縮放</span></div>
    <button class="mainbtn" id="layerBtn"><span class="btnIcon">▱</span><span>過濾血管<small id="layerStatus">完整 · 全部構造</small></span></button>
    <button class="mainbtn" id="routeBtn"><span class="btnIcon">⌁</span><span>血流路徑<small>A → B</small></span></button>
    
    <section id="routePanel" class="routePanel" hidden>
      <div class="panelTitle"><strong>血流路徑</strong><button id="closeRoute" aria-label="關閉路徑">✕</button></div>
      <div class="routeGrid">
        <label><span>A 起點</span><select id="from" aria-label="A 起點"></select></label>
        <span class="routeArrow" aria-hidden="true">→</span>
        <label><span>B 終點</span><select id="to" aria-label="B 終點"></select></label>
      </div>
      <div class="routeActions"><button class="action" id="calculate" type="button">▶ 播放血流</button><button id="routeClear" class="routeClear" type="button" aria-label="重選起點終點">↺ 重選</button></div><div id="routeNote" class="routeNote" aria-live="polite"></div>
      <div class="player" id="player" hidden>
        <button id="prev" hidden aria-label="上一站">◀</button><button id="next" hidden aria-label="下一站">▶</button>
        <button id="toggleFlow" type="button" aria-label="暫停或繼續血流">⏸ 暫停</button>
        <span id="routeIndex" aria-live="off">—</span>
      </div>
      <div id="routeResult" hidden></div><div id="routeAssist" hidden><span id="routeAssistText"></span></div>
    </section>
  </aside>
  <div class="shade" id="shade" hidden></div>
  <section class="tools" id="tools" aria-label="進階工具" hidden>
    <div class="panelTitle"><strong>觀察工具</strong><button id="closeTools">✕</button></div>
    <div class="toolLine"><span>顯示內容</span><div class="chips"><button id="allVessels" class="active">動靜脈</button><button id="arteriesOnly">動脈</button><button id="veinsOnly">靜脈</button></div></div>
    <div class="toolLine"><span>血管搜尋</span><input id="search" placeholder="搜尋構造（進階）…" autocomplete="off"/><div id="searchList" class="searchList"></div></div>
    <div class="toolLine"><span>一鍵轉到</span><div class="chips"><button data-view="front">正面</button><button data-view="back">背面</button><button data-view="left">左側</button><button data-view="right">右側</button></div></div>
    <div class="toolLine"><span>環境檢測</span><a class="legacy" href="./diagnostics.html">執行模型與瀏覽器驗收</a></div>
    <div class="toolLine"><span>額外資訊</span><div id="diagnostics" class="diagnostics">等待模型分析…</div></div>
    
    <a href="./ATTRIBUTION.md" class="legacy">解剖模型來源與授權</a>
    <p class="toolsNote">三級分層以國中教學為優先，肋間細分支只在完整層顯示。肺動脈以藍色顯示、肺靜脈以紅色顯示：顏色表示血氧狀態，而非動、靜脈定義。</p>
  </section>
</div>
<script src="./js/graph-engine.js"></script>
<script>
  const bootTitle = document.getElementById('loadingTitle');
  const bootDetail = document.getElementById('loadingDetail');
  const retryBtn = document.getElementById('retry');
  function failBootstrap(message) {
    if(window.__viewerBootState==='loaded' || window.__viewerBootState==='failed' || window.__viewerDiagnostics?.moduleImported)return;
    window.__viewerBootState='failed';
    window.__viewerDiagnostics.error=message;
    bootTitle.textContent='3D 程式庫未能啟動';
    bootDetail.textContent=message;
    retryBtn.hidden=false;
  }
  retryBtn.addEventListener('click',()=>{
    const u=new URL(location.href);
    if(!window.__vendorLocal){
      if(u.searchParams.get('cdn')==='unpkg')u.searchParams.delete('cdn');
      else u.searchParams.set('cdn','unpkg');
    }
    location.assign(u.href);
  });
  window.addEventListener('unhandledrejection',e=>{
    if(window.__viewerBootState!=='loaded' && window.__viewerBootState!=='failed')
      failBootstrap('3D 模組初始化失敗，請開啟環境檢測頁查看原因。');
  });
  async function bootViewer(){
    // Register before requesting models or runtime modules. No second copy of GLBs is downloaded.
    if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')) {
      try {
        const before=navigator.serviceWorker.controller;
        const registration=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
        // Do not treat a stale controller as the current build after GitHub Pages publishes a new ZIP.
        // This asks the browser to check the worker now, not at its usual periodic interval.
        try { await Promise.race([registration.update(),new Promise((_,reject)=>setTimeout(()=>reject(Error('SW update timeout')),3500))]); }
        catch(err){console.info('SW update not confirmed; continue with online fallback',err);}
        await Promise.race([navigator.serviceWorker.ready,new Promise((_,reject)=>setTimeout(()=>reject(Error('SW ready timeout')),3200))]);
        if(!navigator.serviceWorker.controller)await Promise.race([
          new Promise(resolve=>navigator.serviceWorker.addEventListener('controllerchange',resolve,{once:true})),
          new Promise(resolve=>setTimeout(resolve,1400))
        ]);
        if(before&&before!==navigator.serviceWorker.controller){
          // A new worker took control while the old HTML scripts were loading.
          // One reload is necessary to ensure every local module is from the same release.
          let already=false;try{already=sessionStorage.getItem('blood3d-v057-sw-reload')==='1';}catch{}
          if(!already){try{sessionStorage.setItem('blood3d-v057-sw-reload','1');}catch{}
            location.reload();return;}
        }
        if(navigator.serviceWorker.controller){
          const workerVersion=await new Promise(resolve=>{
            const ch=new MessageChannel();const timer=setTimeout(()=>{ch.port1.close();resolve(null)},520);
            ch.port1.onmessage=e=>{clearTimeout(timer);ch.port1.close();resolve(e.data?.version||null)};
            try{navigator.serviceWorker.controller.postMessage({type:'BLOOD3D_VERSION'},[ch.port2]);}
            catch{clearTimeout(timer);resolve(null);}
          });
          if(workerVersion&&workerVersion!=='V0.57')console.warn('Different service worker release:',workerVersion);
        }
      } catch(err) { console.warn('Cache unavailable; continuing online',err); }
    }
    window.__viewerBootState='starting';
    window.__viewerDiagnostics.error=null;
    const mod=document.createElement('script');mod.type='module';mod.src='./js/viewer.js';
    mod.onerror=()=>failBootstrap('無法載入 3D 模組。請檢查 vendor 檔案與網路連線。');
    document.body.appendChild(mod);
    setTimeout(()=>{
      // Module startup and model decoding are different stages. Only fail a missing module,
      // not a large GLB legitimately decoding on an older iPad.
      if(window.__viewerBootState==='starting' && !window.__viewerDiagnostics?.moduleImported)
        failBootstrap('3D 程式模組未能初始化；請檢查本地程式庫與解碼器。');
    },30000);
  }
  bootViewer();
</script>
<!-- viewer.js is added once by bootViewer() after the runtime check -->
<script src="home-button.js"></script>
</body>
</html>
